<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veer Survivor — Local Combat Display Arena</title>
  <meta name="description" content="Local Screen Display for Veer Survivor: Automated 2D Combat Playback with Animated Attacks, Damage Popups, and Character Emotes.">

  <!-- Google Fonts: Anton, JetBrains Mono, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400..800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="local_screen.css">
</head>
<body class="screen-body">

  <!-- Custom Crosshair Cursor -->
  <div class="custom-cursor" id="customCursor"></div>

  <!-- Ambient Stage Glows -->
  <div class="ambient-glow glow-cyan"></div>
  <div class="ambient-glow glow-fire"></div>

  <!-- ========================================================================= -->
  <!-- 1. TOP BROADCAST HEADER -->
  <!-- ========================================================================= -->
  <header class="screen-header">
    <div class="screen-header-left">
      <div class="broadcast-live-badge">
        <span class="live-pulse-dot"></span>
        <span>LOCAL BROADCAST ARENA</span>
      </div>
      <h1 class="screen-match-title" id="screenMatchTitle">PHANTOM-9 vs SOL-VANGUARD</h1>
    </div>

    <!-- Center Score Board -->
    <div class="screen-score-board">
      <div class="score-side score-a" id="screenScoreA">13</div>
      <div class="score-vs-divider">VS</div>
      <div class="score-side score-b" id="screenScoreB">9</div>
    </div>

    <div class="screen-header-right">
      <div class="status-indicator" id="screenStatusIndicator">STATUS: READY</div>
      <div class="screen-header-buttons">
        <button class="btn btn-secondary btn-xs" id="btnToggleAutoPoll" title="Automatically play new matches when adjudicated">
          <i data-lucide="radio"></i> Auto-Sync: <span id="autoPollStatus">ON</span>
        </button>
        <button class="btn btn-primary btn-xs" id="btnFetchLatest">
          <i data-lucide="refresh-cw"></i> Fetch Match
        </button>
        <button class="btn btn-secondary btn-xs" id="btnToggleFullscreen">
          <i data-lucide="maximize"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Timeline Progress Bar -->
  <div class="screen-timeline-bar-wrap">
    <div class="screen-timeline-fill" id="timelineProgressFill" style="width: 0%;"></div>
  </div>

  <!-- ========================================================================= -->
  <!-- 2. MAIN 2D COMBAT ARENA STAGE -->
  <!-- ========================================================================= -->
  <main class="screen-arena-stage" id="arenaStage">

    <!-- ARENA BACKGROUND ELEMENTS -->
    <div class="arena-hologram-ring"></div>
    <div class="arena-floor-grid"></div>

    <!-- ======================================================================= -->
    <!-- PLAYER A (LEFT: PHANTOM-9) -->
    <!-- ======================================================================= -->
    <div class="combat-actor actor-side-a" id="actorPlayerA">
      
      <!-- Emote Speech Bubble -->
      <div class="actor-emote-bubble" id="bubbleA" style="display: none;">
        <span class="bubble-icon" id="bubbleIconA">🗡️</span>
        <span class="bubble-text" id="bubbleTextA">"Watch this angle."</span>
      </div>

      <!-- Health & Shield Bars -->
      <div class="actor-bars-card">
        <div class="actor-name-tag">
          <strong id="actorNameA">Player A</strong>
          <span class="char-id-tag cyan" id="actorCharTagA">PHANTOM-9</span>
        </div>
        <!-- Health Bar -->
        <div class="bar-row">
          <span class="bar-lbl">HP</span>
          <div class="bar-track">
            <div class="bar-fill hp" id="barHpA" style="width: 100%;"></div>
          </div>
          <span class="bar-num" id="numHpA">100</span>
        </div>
        <!-- Shield Bar -->
        <div class="bar-row">
          <span class="bar-lbl">SHD</span>
          <div class="bar-track">
            <div class="bar-fill shd" id="barShdA" style="width: 100%;"></div>
          </div>
          <span class="bar-num" id="numShdA">50</span>
        </div>
      </div>

      <!-- 2D Visual Character Avatar Body -->
      <div class="actor-sprite-wrapper" id="spriteA">
        <div class="actor-glow-aura cyan"></div>
        <div class="actor-character-model phantom-model">
          <div class="model-head">
            <div class="model-visor cyan"></div>
          </div>
          <div class="model-torso">
            <div class="model-core cyan"></div>
          </div>
          <div class="model-weapon blade-left"></div>
          <div class="model-weapon blade-right"></div>
        </div>
        <div class="actor-shadow"></div>
      </div>

      <!-- Floating Damage / Action Text Anchor -->
      <div class="floating-text-container" id="floatingA"></div>

    </div>

    <!-- ARENA CENTER VS IMPACT ZONE -->
    <div class="arena-center-clash">
      <div class="clash-shockwave" id="clashShockwave"></div>
    </div>

    <!-- ======================================================================= -->
    <!-- PLAYER B (RIGHT: SOL-VANGUARD) -->
    <!-- ======================================================================= -->
    <div class="combat-actor actor-side-b" id="actorPlayerB">
      
      <!-- Emote Speech Bubble -->
      <div class="actor-emote-bubble" id="bubbleB" style="display: none;">
        <span class="bubble-icon" id="bubbleIconB">🛡️</span>
        <span class="bubble-text" id="bubbleTextB">"Perimeter secured."</span>
      </div>

      <!-- Health & Shield Bars -->
      <div class="actor-bars-card">
        <div class="actor-name-tag">
          <strong id="actorNameB">Player B</strong>
          <span class="char-id-tag orange" id="actorCharTagB">SOL-VANGUARD</span>
        </div>
        <!-- Health Bar -->
        <div class="bar-row">
          <span class="bar-lbl">HP</span>
          <div class="bar-track">
            <div class="bar-fill hp" id="barHpB" style="width: 100%;"></div>
          </div>
          <span class="bar-num" id="numHpB">100</span>
        </div>
        <!-- Shield Bar -->
        <div class="bar-row">
          <span class="bar-lbl">SHD</span>
          <div class="bar-track">
            <div class="bar-fill shd" id="barShdB" style="width: 100%;"></div>
          </div>
          <span class="bar-num" id="numShdB">50</span>
        </div>
      </div>

      <!-- 2D Visual Character Avatar Body -->
      <div class="actor-sprite-wrapper" id="spriteB">
        <div class="actor-glow-aura orange"></div>
        <div class="actor-character-model vanguard-model">
          <div class="model-head">
            <div class="model-visor orange"></div>
          </div>
          <div class="model-torso heavy">
            <div class="model-core orange"></div>
          </div>
          <div class="model-weapon shield-plate"></div>
        </div>
        <div class="actor-shadow"></div>
      </div>

      <!-- Floating Damage / Action Text Anchor -->
      <div class="floating-text-container" id="floatingB"></div>

    </div>

  </main>

  <!-- ========================================================================= -->
  <!-- 3. LIVE COMMENTARY & COMBAT EVENT TICKER -->
  <!-- ========================================================================= -->
  <footer class="screen-footer">
    <div class="commentary-card">
      <div class="commentary-meta">
        <i data-lucide="mic" style="color: #ffd700;"></i>
        <span>TACTICAL BROADCAST FEED</span>
        <span class="commentary-time" id="commentaryTime">[00.0s]</span>
      </div>
      <p class="commentary-text" id="commentaryText">
        Connecting to local game backend... Ready for match sequence.
      </p>
    </div>
  </footer>

  <script src="local_screen.js"></script>
</body>
</html>
